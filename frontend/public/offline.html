<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8cb46" />
  <title>You're offline · Zippy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f7f8fa;
      color: #1c1c28;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.1);
      overflow: hidden;
      text-align: center;
    }
    .top {
      background: #f8cb46;
      padding: 32px 24px 40px;
      position: relative;
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto;
      background: #1c1c28;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { width: 30px; height: 30px; }
    .wordmark {
      margin-top: 12px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1c1c28;
    }
    .body { padding: 28px 24px 32px; }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.55; color: #667085; }
    .dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #fef3f2;
      color: #d92d20;
      font-size: 12px;
      font-weight: 700;
    }
    .dot span { width: 8px; height: 8px; border-radius: 999px; background: #d92d20; }
    button {
      margin-top: 22px;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: #0c9f4f;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: #0a8a44; }
    .hint { margin-top: 14px; font-size: 12px; color: #98a2b3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="#f8cb46" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z" />
        </svg>
      </div>
      <div class="wordmark">Zippy</div>
    </div>
    <div class="body">
      <div class="dot"><span></span> No connection</div>
      <h1>You're offline</h1>
      <p>Zippy needs the internet to fetch fresh groceries and place orders. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
      <p class="hint">We'll reconnect automatically once you're back online.</p>
    </div>
  </div>
  <script>
    // Auto-retry the moment the browser regains connectivity.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
